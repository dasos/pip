name: CI

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Installs the Android command-line tools and accepts SDK licenses.
      - uses: android-actions/setup-android@v4
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PHONE_VERSION=$(grep -oP 'versionName = "\K[^"]+' phone/build.gradle.kts)
          WEAR_VERSION=$(grep -oP 'versionName = "\K[^"]+' wear/build.gradle.kts)
          if [ "$PHONE_VERSION" != "$WEAR_VERSION" ]; then
            echo "::error::Version mismatch: phone is $PHONE_VERSION but wear is $WEAR_VERSION"
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "v$PHONE_VERSION" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match versionName $PHONE_VERSION"
            exit 1
          fi
      - name: Assemble debug APKs
        run: gradle :phone:assembleDebug :wear:assembleDebug --no-daemon --stacktrace
      - name: Upload debug phone APK
        uses: actions/upload-artifact@v7
        with:
          name: pip-phone-debug-apk
          path: phone/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload debug wear APK
        uses: actions/upload-artifact@v7
        with:
          name: pip-wear-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          generate_release_notes: true
